services:
  monitor:
    build: .
    image: homelab-monitor:1.0
    container_name: homelab-monitor
    restart: unless-stopped
    ports:
      - "8930:8930"
    volumes:
      - ./data:/data
      - ./app:/app:ro
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
